<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전보건 일지 모음</title>
<meta name="description" content="근로자가 안전보건 서류를 쉽게 작성하고 A4로 인쇄하는 일지 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="page-size">@page{size:A4 portrait;margin:12mm}</style>
<style>
:root{
  --paper:#EDF1EE; --panel:#FFFFFF; --ink:#13261E; --text:#2B3A33; --sub:#5C6A63;
  --line:#D3DBD6; --soft:#F6F8F6; --green:#00704A; --green-2:#E2F1E9; --blue:#1D5AA6;
  --yellow-2:#FFF4CC; --red:#B3261E; --doc:#1A1A1A; --docline:#3F3F3F; --dochead:#F0F2F1;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--text);font:15px/1.6 "IBM Plex Sans KR","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- 상단 ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:66px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;text-decoration:none;color:inherit;min-width:0}
.mark{width:38px;height:38px;flex:none;background:var(--green);border-radius:5px;display:grid;place-items:center;position:relative}
.mark::after{content:"";position:absolute;inset:3px;border:1.5px solid rgba(255,255,255,.6);border-radius:3px}
.brand b{display:block;font-size:17px;font-weight:700;color:var(--ink);line-height:1.3}
.brand small{display:block;font-size:12.5px;color:var(--sub);line-height:1.35}
.hublink{font-size:14px;font-weight:500}

/* ---------- 목록 화면 ---------- */
.home{padding-top:30px;padding-bottom:40px}
.intro h1{margin:0;font-size:26px;line-height:1.3;color:var(--ink);letter-spacing:-.02em}
.intro p{margin:8px 0 0;color:var(--sub);max-width:640px}
.hs{position:relative;max-width:420px;margin:20px 0 24px}
.hs input{width:100%;height:44px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:0 14px 0 40px;font-size:15px;color:var(--ink)}
.hs input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,90,166,.18)}
.hs svg{position:absolute;left:13px;top:13px;color:var(--sub)}
.cat{display:grid;grid-template-columns:250px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.cat-l{padding:20px 22px;background:var(--soft);border-right:1px solid var(--line)}
.cat-l h2{margin:0;font-size:17px;color:var(--ink)}
.cat-l p{margin:6px 0 0;font-size:13.5px;color:var(--sub)}
.cnt{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-2);border-radius:4px;padding:1px 8px}
.cat-r.two{display:grid;grid-template-columns:1fr 1fr}
.frow{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 22px;text-decoration:none;color:inherit;border-top:1px solid var(--line)}
.cat-r > .frow:first-child{border-top:0}
.two > .frow:nth-child(2){border-top:0}
.two > .frow:nth-child(even){border-left:1px solid var(--line)}
.frow:hover{background:#F3F7FB}
.frow:hover .ft{color:var(--blue)}
.ft{font-weight:600;color:var(--ink);font-size:15.5px}
.fd{grid-column:1;font-size:13.5px;color:var(--sub)}
.fb{grid-column:2;grid-row:1 / 3;align-self:center;font-size:12.5px;color:var(--sub);text-align:right;white-space:nowrap}
.badge{display:inline-block;margin-left:8px;font-size:12px;font-weight:600;color:#6B5100;background:var(--yellow-2);border:1px solid #E3C766;border-radius:4px;padding:0 6px;vertical-align:1px}
.empty{background:var(--panel);border:1px dashed #A9B5AE;border-radius:10px;padding:22px;text-align:center;color:var(--sub)}
.foot{border-top:1px solid var(--line);padding:20px 0 40px;font-size:13px;color:var(--sub)}
.foot p{margin:2px 0}

/* ---------- 작성 화면 ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar-in{max-width:1260px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;font-size:14px;color:var(--blue);padding:6px 2px}
.bt{margin-right:auto;min-width:0;padding-left:12px;border-left:1px solid var(--line)}
.bt b{display:block;color:var(--ink);font-size:16px;line-height:1.3}
.saved{font-size:12.5px;color:var(--sub)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:38px;padding:0 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#8FA097}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.pri:hover{background:#005C3D}
.btn .n{display:inline-block;min-width:20px;margin-left:4px;padding:0 5px;border-radius:9px;background:var(--soft);font-size:12px;font-weight:600}
.guide{max-width:1260px;margin:16px auto 0;padding:0 20px}
.guide ul{margin:0 auto;max-width:900px;padding:12px 18px 12px 34px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:6px;font-size:13.5px}
.guide li+li{margin-top:2px}
.desk{padding:18px 20px 70px;overflow-x:auto}

/* ---------- A4 서식 ---------- */
.sheet{background:#fff;margin:0 auto;color:var(--doc);font-size:12.5px;line-height:1.5;box-shadow:0 1px 3px rgba(19,38,30,.14),0 10px 28px rgba(19,38,30,.08)}
.sheet.portrait{width:210mm;min-height:297mm;padding:12mm}
.sheet.landscape{width:297mm;min-height:210mm;padding:10mm}
.dhead{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;margin-bottom:10px}
.dhead.solo{grid-template-columns:1fr}
.dtitle{margin:0;font-size:22px;font-weight:700;letter-spacing:.04em;text-align:center}
.appr{border-collapse:collapse;font-size:11.5px}
.appr th,.appr td{border:1px solid var(--docline);text-align:center;padding:0}
.appr th{background:var(--dochead);padding:3px 0;width:70px;font-weight:600}
.appr th.ah{width:22px;line-height:1.35;padding:4px 0}
.appr td{height:60px;vertical-align:bottom}
.appr .sigb{height:36px;min-height:36px}
.appr .in.an{text-align:center;font-size:11px;padding:1px 3px;min-height:20px;border-top:1px dotted #BBB}
.blk{margin-top:12px}
.bh{margin:0 0 5px;font-size:13.5px;font-weight:700}
.bsub{margin:-2px 0 5px;font-size:12px}
table.kv,table.grid{width:100%;border-collapse:collapse;table-layout:fixed}
.kv th,.kv td,.grid th,.grid td{border:1px solid var(--docline);vertical-align:middle}
.kv th{background:var(--dochead);font-weight:600;text-align:center;padding:5px 6px;line-height:1.35}
.kv td{padding:0}
.grid th{background:var(--dochead);font-weight:600;padding:5px 4px;text-align:center;line-height:1.35}
.grid td{padding:0;position:relative}
.grid td.c{text-align:center}
.grid td.item{padding:5px 7px}
.grid td.item .in{padding:0;min-height:0}
.in{display:block;width:100%;border:0;border-radius:0;background:transparent;padding:5px 7px;min-height:30px;color:var(--doc);font-size:12.5px;line-height:1.5}
.in:hover{background:#F4F8FC}
.in:focus{outline:2px solid var(--blue);outline-offset:-2px;background:#fff}
textarea.in{resize:none;overflow:hidden}
select.in{cursor:pointer}
.c select.in{text-align:center;text-align-last:center}
.in::placeholder{color:#A0A8A4}
.tr{display:flex;align-items:center}
.tr .in{flex:1;min-width:0}
.tr span{padding:0 2px}
.unitw{display:flex;align-items:center}
.unitw .in{flex:0 0 auto;width:6em}
.unit{padding-right:8px}
.calc{display:block;padding:5px 7px;min-height:30px}
.tbox{border:1px solid var(--docline)}
.tbox .in{padding:7px 9px}
.basis{margin:12px 0 0;font-size:11px;color:#555;text-align:right}
.mk button{display:block;width:100%;min-height:30px;border:0;background:transparent;cursor:pointer;font-size:15px;font-weight:700;color:var(--doc);line-height:1}
.mk button:hover{background:#EAF1FA}
.mk button[aria-pressed="true"]{background:#EDF5F0}
.own{display:inline-block;margin-top:3px;font-size:10.5px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.sigb{display:flex;align-items:center;justify-content:center;width:100%;min-height:32px;border:0;background:transparent;cursor:pointer;padding:2px}
.sigb img{display:block;max-height:30px;max-width:100%}
.sigb .ph{font-size:11px;color:#A0A8A4}
.sigb:hover{background:#EAF1FA}
.rowdel{position:absolute;right:-32px;top:50%;margin-top:-12px;width:24px;height:24px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--sub);cursor:pointer;font-size:14px;line-height:1;opacity:0}
tr:hover .rowdel,.rowdel:focus-visible{opacity:1}
.rowdel:hover{color:var(--red);border-color:var(--red)}
.tools{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.mini{height:30px;padding:0 12px;border:1px dashed #8FA097;border-radius:5px;background:#fff;color:var(--ink);font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center}
.mini:hover{border-color:var(--blue);color:var(--blue)}
.hint{font-size:12.5px;color:var(--green);margin:6px 0 0;font-weight:500}
.hint.warn{color:var(--red)}
.tnote{font-size:12px;color:var(--sub)}
.photos .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photos figure{margin:0;border:1px solid var(--docline);position:relative;break-inside:avoid}
.photos img{display:block;width:100%;height:62mm;object-fit:contain;background:#FAFAFA}
.photos figcaption{border-top:1px solid var(--docline)}
.photos figcaption .in{text-align:center}
.photos .rowdel{right:6px;top:6px;margin:0;opacity:1}
.photos.none .pgrid{display:none}
.rk .in,.rk .calc{font-size:11.5px;padding:4px 5px}
.rk .calc{text-align:center;font-weight:600}
.crit .cg{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px;align-items:start}
.grid.sm{font-size:11px}
.grid.sm td{padding:3px 6px}
.g1{background:#E3F1E9;color:#145A36}.g2{background:#EEF5E1;color:#3F5A12}.g3{background:#FFF4CC;color:#6B5100}.g4{background:#FDE3CF;color:#8A3B00}.g5{background:#F9D5D2;color:#9B1C14}
.grid.sm .gl{display:inline-block;padding:0 6px;border-radius:3px;font-weight:600}

/* ---------- 창 ---------- */
.modal{position:fixed;inset:0;background:rgba(19,38,30,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.mbox{background:#fff;border-radius:10px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:22px 24px}
.mt{margin:0;font-size:18px;color:var(--ink)}
.ms{margin:6px 0 14px;color:var(--sub);font-size:14px}
.pad{display:block;width:100%;aspect-ratio:1000/360;border:1px dashed #8FA097;border-radius:6px;background:#FCFCFA;touch-action:none;cursor:crosshair}
.mb{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.mb .sp{flex:1}
.pastebox{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:14px;resize:vertical}
.alist{list-style:none;margin:10px 0 0;padding:0}
.alist li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.alist b{display:block;color:var(--ink);font-weight:600}
.alist span{font-size:12.5px;color:var(--sub)}
.ab{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ab .btn{height:32px;font-size:13px;padding:0 10px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:760px){
  .cat{grid-template-columns:1fr}
  .cat-l{border-right:0;border-bottom:1px solid var(--line)}
  .cat-r.two{grid-template-columns:1fr}
  .two > .frow:nth-child(even){border-left:0}
  .two > .frow:nth-child(2){border-top:1px solid var(--line)}
  .bt{border-left:0;padding-left:0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media print{
  html,body{background:#fff}
  .np,.top,.bar,.guide,.toast,.modal,.rowdel,.tools,.hint{display:none!important}
  .desk{padding:0;overflow:visible}
  .sheet{box-shadow:none;width:auto!important;min-height:0!important;padding:0!important;margin:0}
  .in:hover,.in:focus,.mk button:hover,.sigb:hover,.mk button[aria-pressed="true"]{background:transparent;outline:none}
  .in::placeholder{color:transparent}
  .in.empty{color:transparent}
  select.in{appearance:none;-webkit-appearance:none}
  input::-webkit-calendar-picker-indicator{display:none}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{display:none}
  .sigb .ph{visibility:hidden}
  .photos.none{display:none}
  .kv th,.grid th,.appr th,.g1,.g2,.g3,.g4,.g5{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  tr{break-inside:avoid}
  .bh{break-after:avoid}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ==================================================================
   설정 — 여기만 고치면 돼요
   ================================================================== */
const ORG = '성동구도시관리공단';   // 화면 위쪽과 '사업장' 칸의 기본값
const HUB_URL = '';                // 업무 허브 주소를 넣으면 위쪽에 링크가 생겨요
const APP = '안전보건 일지 모음';

/* ==================================================================
   법령 기준 데이터
   ================================================================== */
/* 작업시작 전 점검사항 — 산업안전보건기준에 관한 규칙 별표 3 */
const EQUIP = [
  {id:'forklift', name:'지게차', noPh:'예) 지게차 1호기', items:[
    '제동장치 및 조종장치 기능의 이상 유무',
    '하역장치 및 유압장치 기능의 이상 유무',
    '바퀴의 이상 유무',
    '전조등·후미등·방향지시기 및 경보장치 기능의 이상 유무']},
  {id:'loader', name:'차량계 건설기계', sub:'로더·굴착기 등', noPh:'예) 로더 1호기', items:[
    '브레이크 및 클러치 등의 기능'],
    self:['경광등·후방경보장치 작동 상태','타이어·버킷·유압호스 등 외관(누유·손상) 상태']},
  {id:'cart', name:'구내운반차', noPh:'예) 전동 운반차 2호기', items:[
    '제동장치 및 조종장치 기능의 이상 유무',
    '하역장치 및 유압장치 기능의 이상 유무',
    '바퀴의 이상 유무',
    '전조등·후미등·방향지시기 및 경음기 기능의 이상 유무',
    '충전장치를 포함한 홀더 등의 결합상태의 이상 유무']},
  {id:'truck', name:'화물자동차', noPh:'예) 12가 3456', items:[
    '제동장치 및 조종장치의 기능',
    '하역장치 및 유압장치의 기능',
    '바퀴의 이상 유무']},
  {id:'aerial', name:'고소작업대', noPh:'예) 시저형 고소작업대 1호기', items:[
    '비상정지장치 및 비상하강 방지장치 기능의 이상 유무',
    '과부하 방지장치의 작동 유무(와이어로프 또는 체인구동방식의 경우)',
    '아웃트리거 또는 바퀴의 이상 유무',
    '작업면의 기울기 또는 요철 유무',
    '활선작업용 장치의 경우 홈·균열·파손 등 그 밖의 손상 유무']},
  {id:'conveyor', name:'컨베이어', noPh:'예) 선별 컨베이어 2호', items:[
    '원동기 및 풀리(pulley) 기능의 이상 유무',
    '이탈 등의 방지장치 기능의 이상 유무',
    '비상정지장치 기능의 이상 유무',
    '원동기·회전축·기어 및 풀리 등의 덮개 또는 울 등의 이상 유무']},
  {id:'compressor', name:'공기압축기', noPh:'예) 기계실 공기압축기', items:[
    '공기저장 압력용기의 외관 상태',
    '드레인밸브(drain valve)의 조작 및 배수',
    '압력방출장치의 기능',
    '언로드밸브(unloading valve)의 기능',
    '윤활유의 상태',
    '회전부의 덮개 또는 울',
    '그 밖의 연결 부위의 이상 유무']},
  {id:'hotwork', name:'용접·용단 등 화재위험작업', noPh:'예) 2층 배관 용접 작업', items:[
    '작업 준비 및 작업 절차 수립 여부',
    '화기작업에 따른 인근 가연성물질에 대한 방호조치 및 소화기구 비치 여부',
    '용접불티 비산방지덮개 또는 용접방화포 등 불꽃·불티 등의 비산을 방지하기 위한 조치 여부',
    '인화성 액체의 증기 또는 인화성 가스가 남아 있지 않도록 하는 환기 조치 여부',
    '작업근로자에 대한 화재예방 및 피난교육 등 비상조치 여부']}
];
const EQ = id => EQUIP.find(e => e.id === id);

/* 교육과정별 교육시간 — 산업안전보건법 시행규칙 별표 4
   [대상, 법정 시간, 한 번에 비교할 최소 시간(0이면 반기·연간 누계로 판단)] */
const EDU = {

/* ==================================================================
   계산 도우미
   ================================================================== */
function eduRow(s){ return (EDU[s.course]||[]).find(r=>r[0]===s.target); }
function durH(s){
  if(!s.time_s||!s.time_e) return null;
  const m = t => { const a=t.split(':'); return (+a[0])*60+(+a[1]); };
  const d = m(s.time_e)-m(s.time_s);
  return d>0 ? d/60 : null;
}
function fmtH(h){ const m=Math.round(h*60), H=Math.floor(m/60), M=m%60; return (H?H+'시간':'')+(M?(H?' ':'')+M+'분':'')||'0분'; }
function attCount(s){ return (s.people||[]).filter(r=>r.name&&r.name.trim()).length; }
function eduHint(s){
  const r=eduRow(s); if(!r) return '';
  if(r[2]===0) return {t:'정기교육은 '+(s.target==='관리감독자'?'연간':'반기')+' 누계로 법정 시간을 채우면 돼요. 누계는 교육 관리대장에서 확인하세요.'};
  const h=durH(s);
  if(h==null) return {t:'교육 시작·종료 시각을 넣으면 법정 시간과 비교해요.'};
  if(h+1e-9>=r[2]) return {t:'이번 교육 '+fmtH(h)+'으로 법정 시간('+r[2]+'시간'+(r[1].includes('최초')?', 최초 작업 전 기준':'')+')을 채웠어요.'};
  return {t:'이번 교육이 법정 시간보다 '+fmtH(r[2]-h)+' 모자라요.', c:'warn'};
}
function riskCell(f,s){
  if(!f||!s) return {t:'',c:''};
  const sc=(+f)*(+s), g=RISK.grades.find(x=>sc<=x.max)||RISK.grades[RISK.grades.length-1];
  return {t:sc+' '+g.name, c:g.c};
}

const P='ilji.v1.';
const LS = {
  get(k,d){ try{ const v=localStorage.getItem(P+k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(P+k,JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(P+k); }catch(e){} }
};
const pad2 = n => String(n).padStart(2,'0');
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(v){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); return m?m[1]+'. '+(+m[2])+'. '+(+m[3])+'.':v; }
function fmtStamp(t){ const d=new Date(t); return (d.getMonth()+1)+'월 '+d.getDate()+'일 '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (q,el=document) => el.querySelector(q);
const byId = id => FORMS.find(f=>f.id===id);
const blockByK = k => cur.def.blocks.find(b=>b.k===k);
function getP(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k], o); }
function setP(o,p,v){ const a=p.split('.'); let x=o; for(let i=0;i<a.length-1;i++) x=x[a[i]]; x[a[a.length-1]]=v; }
function emptyRow(cols){ const o={}; cols.forEach(c=>{ if(c.t!=='num'&&c.t!=='calc') o[c.k]=''; }); return o; }

function newState(def){
  const s={}, sh=LS.get('shared',{});
  if(!sh.org) sh.org=ORG;
  def.blocks.forEach(b=>{
    if(b.t==='info') b.rows.forEach(r=>r.forEach(f=>{
      if(f.t==='calc') return;
      if(f.t==='trange'){ s[f.k+'_s']=(f.def||[])[0]||''; s[f.k+'_e']=(f.def||[])[1]||''; return; }
      let v = f.def==='today' ? todayStr() : (f.def==null?'':f.def);
      if(f.shared && sh[f.shared]) v=sh[f.shared];
      s[f.k]=v;
    }));
    else if(b.t==='text') s[b.k]=b.def||'';
    else if(b.t==='table'){
      const rows=(b.def||[]).map(d=>Object.assign(emptyRow(b.cols),d));
      while(rows.length<(b.min||1)) rows.push(emptyRow(b.cols));
      s[b.k]=rows;
    }
    else if(b.t==='check'){
      s[b.k]=b.items.map(n=>({name:n,res:'',note:'',src:'law'})).concat((b.self||[]).map(n=>({name:n,res:'',note:'',src:'self'})));
    }
  });
  s._appr=(def.approval||[]).map(l=>({l,n:'',sig:''}));
  return s;
}

  let h='<header class="top"><div class="wrap"><a class="brand" href="#/">'+MARK+'<span><b>'+APP+'</b><small>'+esc(ORG)+'</small></span></a>'
    +(HUB_URL?'<a class="hublink" href="'+esc(HUB_URL)+'">업무 허브로 가기</a>':'')+'</div></header>';
  h+='<main class="wrap home"><div class="intro"><h1>작성할 서식을 고르세요</h1><p>칸을 채우면 A4 서식이 바로 만들어져요. 인쇄하거나 PDF로 저장할 수 있고, 입력한 내용은 이 컴퓨터에 자동으로 저장돼요.</p></div>';
  h+='<div class="hs" role="search">'+GLASS+'<input id="q" type="search" placeholder="서식 찾기 (예: 지게차, 교육)" aria-label="서식 찾기" autocomplete="off"></div>';
  CATS.forEach(c=>{
    const list=FORMS.filter(f=>f.cat===c.id), two=list.length>4;
    h+='<section class="cat"><div class="cat-l"><h2>'+esc(c.name)+'</h2><p>'+esc(c.desc)+'</p><span class="cnt">'+list.length+'종</span></div><div class="cat-r'+(two?' two':'')+'">'
      +list.map(f=>{ const d=LS.get('draft.'+f.id);
        return '<a class="frow" href="#/f/'+f.id+'" data-s="'+esc(f.title+' '+f.desc+' '+c.name+' '+f.docTitle)+'"><span class="ft">'+esc(f.title)+(d&&d._touched?'<span class="badge">작성 중</span>':'')+'</span><span class="fd">'+esc(f.desc)+'</span>'+(two?'':'<span class="fb">'+esc(f.basisShort||'')+'</span>')+'</a>';
      }).join('')+'</div></section>';
  });
  h+='<p class="empty" id="empty" hidden></p></main>';
  h+='<footer class="foot"><div class="wrap"><p>입력한 내용은 이 컴퓨터의 브라우저에만 저장되고, 어디로도 보내지 않아요. 여러 사람이 함께 쓰는 컴퓨터라면 작성을 마친 뒤 [모두 비우기]를 눌러 주세요.</p><p>미리 채워진 문구와 평가 기준은 예시예요. 공단 기준과 현장에 맞게 고쳐 쓰세요.</p></div></footer>';
  app.innerHTML=h;
}
function filterHome(q){
  q=q.replace(/\s+/g,'').toLowerCase(); let any=false;
  document.querySelectorAll('.frow').forEach(a=>{ const ok=!q||a.dataset.s.replace(/\s+/g,'').toLowerCase().includes(q); a.hidden=!ok; if(ok) any=true; });
  document.querySelectorAll('.cat').forEach(c=>{ c.hidden=!!q&&!c.querySelector('.frow:not([hidden])'); });
  const em=$('#empty'); em.hidden=!q||any; if(q&&!any) em.textContent='찾는 서식이 없어요. 다른 낱말로 찾아보세요.';
}

/* ---------- 작성 화면 ---------- */
function renderForm(id){
  const def=byId(id); if(!def){ location.hash='#/'; return; }
  const s=LS.get('draft.'+id) || newState(def);
  cur={def, s, shared:{}};
  def.blocks.forEach(b=>{ if(b.t==='info') b.rows.forEach(r=>r.forEach(f=>{ if(f.shared) cur.shared[f.k]=f.shared; })); });
  PHOTOS[id]=PHOTOS[id]||[];
  document.title=def.docTitle+' - '+APP;
  setPage(def.orient||'portrait');
  app.innerHTML=
    '<header class="bar np"><div class="bar-in">'
    +'<a class="back" href="#/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>서식 목록</a>'
    +'<div class="bt"><b>'+esc(def.title.includes(def.docTitle)?def.title:def.docTitle)+'</b><span class="saved" id="saved">입력하면 자동으로 저장돼요</span></div>'
    +'<div class="acts"><button class="btn" data-act="arch">지난 문서<span class="n" id="archn"></span></button>'
    +'<button class="btn" data-act="newdoc">보관하고 새로 작성</button>'
    +'<button class="btn" data-act="reset">모두 비우기</button>'
    +'<button class="btn pri" data-act="print">인쇄·PDF 저장</button></div></div></header>'
    +'<div class="guide np"><ul>'+(def.guide||[]).concat(['미리 채워진 문구는 예시예요. 칸을 눌러 현장에 맞게 고쳐 쓰세요. 서명 칸을 누르면 마우스로 서명할 수 있어요.','PDF로 저장하려면 [인쇄·PDF 저장]을 누르고, 대상(프린터)을 "PDF로 저장"으로 바꾸세요.']).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>'
    +'<div class="desk"><article class="sheet '+(def.orient||'portrait')+'" id="sheet" aria-label="'+esc(def.docTitle)+'"></article></div>';
  drawSheet();
}

function drawSheet(){
  CALC={};
  $('#sheet').innerHTML=sheetHTML(cur.def,cur.s);
  updateCalcs(); autosizeAll(); markEmpty(); updateArchCount();
}

function sheetHTML(def,s){
  let n=0;
  let h='<div class="dhead'+(s._appr.length?'':' solo')+'"><h1 class="dtitle">'+esc(def.docTitle)+'</h1>'+apprHTML(s)+'</div>';
  def.blocks.forEach((b,bi)=>{ const num=b.title?(++n)+'. ':''; h+=BLK[b.t](b,s,num,bi); });
  return h+'<p class="basis">근거: '+esc(def.basis)+'</p>';
}
const bh = (b,num) => b.title?'<h2 class="bh">'+num+esc(b.title)+'</h2>'+(b.sub?'<p class="bsub">'+esc(b.sub)+'</p>':''):'';

function apprHTML(s){
  if(!s._appr.length) return '';
  return '<table class="appr"><tr><th class="ah" rowspan="2">결<br>재</th>'+s._appr.map(a=>'<th>'+esc(a.l)+'</th>').join('')+'</tr><tr>'
    +s._appr.map((a,i)=>'<td>'+sigHTML('_appr.'+i+'.sig',a.sig,a.l)+'<input class="in an" data-p="_appr.'+i+'.n" value="'+esc(a.n)+'" placeholder="성명" aria-label="'+esc(a.l)+' 성명"></td>').join('')+'</tr></table>';
}
function sigHTML(p,v,label){
  return '<button type="button" class="sigb" data-act="sign" data-p="'+p+'" aria-label="'+esc(label||'')+' 서명'+(v?' (서명됨)':'')+'">'+(v?'<img src="'+v+'" alt="서명">':'<span class="ph">서명</span>')+'</button>';
}
function optsOf(f,s){ return typeof f.opts==='function'?f.opts(s):f.opts; }
function selHTML(p,opts,v,label){
  return '<select class="in" data-p="'+p+'" aria-label="'+esc(label)+'">'+opts.map(o=>'<option'+(String(v)===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
}
function fieldHTML(f,s){
  const v=s[f.k], ph=f.ph?' placeholder="'+esc(f.ph)+'"':'', al=' aria-label="'+esc(f.l)+'"';
  switch(f.t){
    case 'calc': CALC[f.k]={fn:f.fn}; return '<span class="calc" data-calc="'+f.k+'"></span>';
    case 'sel': return selHTML(f.k,optsOf(f,s),v,f.l);
    case 'date': return '<input class="in" type="date" data-p="'+f.k+'" value="'+esc(v)+'"'+al+'>';
    case 'time': return '<input class="in" type="time" data-p="'+f.k+'" value="'+esc(v)+'"'+al+'>';
    case 'number': return '<span class="unitw"><input class="in" type="number" min="0" inputmode="numeric" data-p="'+f.k+'" value="'+esc(v)+'"'+al+'><span class="unit">'+esc(f.unit||'')+'</span></span>';
    case 'trange': return '<span class="tr"><input class="in" type="time" data-p="'+f.k+'_s" value="'+esc(s[f.k+'_s'])+'" aria-label="'+esc(f.l)+' 시작"><span>~</span><input class="in" type="time" data-p="'+f.k+'_e" value="'+esc(s[f.k+'_e'])+'" aria-label="'+esc(f.l)+' 종료"></span>';
    default: return '<input class="in" type="text" data-p="'+f.k+'" value="'+esc(v)+'"'+ph+al+'>';
  }
}
function headHTML(cols){
  if(!cols.some(c=>c.g)) return '<tr>'+cols.map(c=>'<th scope="col">'+esc(c.l)+'</th>').join('')+'</tr>';
  let r1='', r2='', i=0;
  while(i<cols.length){
    const c=cols[i];
    if(c.g){ let j=i; while(j<cols.length&&cols[j].g===c.g) j++; r1+='<th colspan="'+(j-i)+'">'+esc(c.g)+'</th>'; for(let k=i;k<j;k++) r2+='<th scope="col">'+esc(cols[k].l)+'</th>'; i=j; }
    else { r1+='<th rowspan="2" scope="col">'+esc(c.l)+'</th>'; i++; }
  }
  return '<tr>'+r1+'</tr><tr>'+r2+'</tr>';
}
const delBtn = (k,i) => '<button type="button" class="rowdel np" data-act="delrow" data-k="'+k+'" data-i="'+i+'" aria-label="'+(i+1)+'번 줄 삭제">×</button>';

const BLK = {
  info(b,s,num){
    let h='<section class="blk">'+bh(b,num)+'<table class="kv"><colgroup><col style="width:15%"><col style="width:35%"><col style="width:15%"><col style="width:35%"></colgroup>';
    b.rows.forEach(r=>{ h+='<tr>'+r.map(f=>'<th scope="row">'+esc(f.l)+'</th><td'+(r.length===1?' colspan="3"':'')+'>'+fieldHTML(f,s)+'</td>').join('')+'</tr>'; });
    return h+'</table></section>';
  },
  text(b,s,num){
    return '<section class="blk">'+bh(b,num)+'<div class="tbox"><textarea class="in ta" rows="'+(b.rows||3)+'" data-p="'+b.k+'" placeholder="'+esc(b.ph||'')+'" aria-label="'+esc(b.title)+'">'+esc(s[b.k])+'</textarea></div>'
      +(b.example?'<div class="tools"><button type="button" class="mini" data-act="example" data-k="'+b.k+'">'+esc(b.exLabel||'예시 문구 넣기')+'</button></div>':'')+'</section>';
  },
  hint(b,s,num,bi){ CALC['__h'+bi]={fn:b.fn}; return '<p class="hint np" data-calc="__h'+bi+'"></p>'; },
  table(b,s,num){
    const cols=b.cols, tw=cols.reduce((a,c)=>a+(c.w||10),0);
    let h='<section class="blk">'+bh(b,num)+'<table class="grid'+(b.cls?' '+b.cls:'')+'"><colgroup>'+cols.map(c=>'<col style="width:'+((c.w||10)/tw*100).toFixed(2)+'%">').join('')+'</colgroup><thead>'+headHTML(cols)+'</thead><tbody>';
    s[b.k].forEach((r,i)=>{
      h+='<tr>'+cols.map((c,ci)=>{
        const p=b.k+'.'+i+'.'+c.k, center=['num','calc','sel','sig','date'].includes(c.t);
        let x;
        if(c.t==='num') x=String(i+1);
        else if(c.t==='calc'){ CALC[p]={fn:c.fn,row:true}; x='<span class="calc" data-calc="'+p+'"></span>'; }
        else if(c.t==='sel') x=selHTML(p,c.opts,r[c.k],c.l+' '+(i+1));
        else if(c.t==='date') x='<input class="in" type="date" data-p="'+p+'" value="'+esc(r[c.k])+'" aria-label="'+esc(c.l)+' '+(i+1)+'">';
        else if(c.t==='sig') x=sigHTML(p,r[c.k],(r.name||(i+1)+'번'));
        else if(c.t==='text1') x='<input class="in" type="text" data-p="'+p+'" value="'+esc(r[c.k])+'" aria-label="'+esc(c.l)+' '+(i+1)+'">';
        else x='<textarea class="in ta" rows="1" data-p="'+p+'" aria-label="'+esc(c.l)+' '+(i+1)+'"'+(i===0&&c.ph?' placeholder="'+esc(c.ph)+'"':'')+'>'+esc(r[c.k])+'</textarea>';
        return '<td'+(center?' class="c"':'')+'>'+x+(ci===cols.length-1?delBtn(b.k,i):'')+'</td>';
      }).join('')+'</tr>';
    });
    h+='</tbody></table><div class="tools"><button type="button" class="mini" data-act="addrow" data-k="'+b.k+'" data-n="1">+ 줄 추가</button>';
    if((b.tools||[]).includes('add5')) h+='<button type="button" class="mini" data-act="addrow" data-k="'+b.k+'" data-n="5">+ 5줄 추가</button>';
    if((b.tools||[]).includes('paste')) h+='<button type="button" class="mini" data-act="paste" data-k="'+b.k+'">명단 붙여넣기</button>';
    return h+'</div></section>';
  },
  check(b,s,num){
    const opts=b.opts||['양호','불량','해당 없음'];
    let h='<section class="blk">'+bh(b,num)+'<table class="grid chk"><colgroup><col style="width:6%"><col style="width:'+(b.opts?44:46)+'%">'+opts.map(()=>'<col style="width:8%">').join('')+'<col></colgroup><thead><tr><th scope="col">번호</th><th scope="col">'+esc(b.label||'점검 항목')+'</th>'+opts.map(o=>'<th scope="col">'+esc(o)+'</th>').join('')+'<th scope="col">조치 사항</th></tr></thead><tbody>';
    s[b.k].forEach((r,i)=>{
      const p=b.k+'.'+i;
      h+='<tr><td class="c">'+(i+1)+'</td><td class="item">'+(r.src==='law'?esc(r.name):'<textarea class="in ta" rows="1" data-p="'+p+'.name" placeholder="점검 항목을 적으세요" aria-label="'+(i+1)+'번 점검 항목">'+esc(r.name)+'</textarea><span class="own np">자체 항목</span>')+'</td>'
        +opts.map(o=>'<td class="c mk"><button type="button" data-act="mark" data-p="'+p+'.res" data-v="'+esc(o)+'" aria-pressed="'+(r.res===o)+'" aria-label="'+(i+1)+'번 '+esc(o)+'">'+(r.res===o?'○':'')+'</button></td>').join('')
        +'<td><textarea class="in ta" rows="1" data-p="'+p+'.note" aria-label="'+(i+1)+'번 조치 사항">'+esc(r.note)+'</textarea>'+(r.src!=='law'?delBtn(b.k,i):'')+'</td></tr>';
    });
    return h+'</tbody></table><div class="tools"><button type="button" class="mini" data-act="addchk" data-k="'+b.k+'">+ 점검 항목 추가</button></div></section>';
  },
  criteria(b,s,num){
    return '<section class="blk crit">'+bh(b,num)+'<div class="cg">'
      +'<table class="grid sm"><colgroup><col style="width:14%"><col style="width:26%"><col></colgroup><thead><tr><th colspan="3">빈도 (가능성)</th></tr></thead><tbody>'+RISK.freq.map(r=>'<tr><td class="c">'+r[0]+'</td><td class="c">'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table>'
      +'<table class="grid sm"><colgroup><col style="width:14%"><col style="width:18%"><col></colgroup><thead><tr><th colspan="3">강도 (중대성)</th></tr></thead><tbody>'+RISK.sev.map(r=>'<tr><td class="c">'+r[0]+'</td><td class="c">'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')+'</tbody></table>'
      +'<table class="grid sm"><colgroup><col style="width:30%"><col style="width:24%"><col></colgroup><thead><tr><th>위험성 (빈도×강도)</th><th>등급</th><th>관리 기준</th></tr></thead><tbody>'+RISK.grades.map(g=>'<tr><td class="c">'+g.range+'</td><td class="c"><span class="gl '+g.c+'">'+g.name+'</span></td><td>'+g.act+'</td></tr>').join('')+'</tbody></table>'
      +'</div></section>';
  },
  photos(b,s,num){
    const ph=PHOTOS[cur.def.id]||[];
    return '<section class="blk photos'+(ph.length?'':' none')+'">'+bh(b,num)+'<div class="pgrid">'
      +ph.map((x,i)=>'<figure><img src="'+x.url+'" alt="'+esc(x.cap||'사진 '+(i+1))+'"><figcaption><input class="in" data-photo="'+i+'" value="'+esc(x.cap)+'" placeholder="사진 설명" aria-label="사진 '+(i+1)+' 설명"></figcaption><button type="button" class="rowdel np" data-act="delphoto" data-i="'+i+'" aria-label="사진 '+(i+1)+' 삭제">×</button></figure>').join('')
      +'</div><div class="tools"><label class="mini" style="cursor:pointer">+ 사진 추가<input type="file" accept="image/*" multiple data-act="addphoto" hidden></label><span class="tnote">사진은 저장되지 않아요. 인쇄하기 직전에 넣어 주세요. 사진이 없으면 이 칸은 인쇄되지 않아요.</span></div></section>';
  }
};

function updateCalcs(){
  document.querySelectorAll('#sheet [data-calc]').forEach(el=>{
    const c=CALC[el.dataset.calc]; if(!c) return;
    const a=el.dataset.calc.split('.');
    const v=c.row ? c.fn(cur.s[a[0]][a[1]],cur.s) : c.fn(cur.s);
    const base=el.classList.contains('hint')?'hint np':'calc';
    if(v&&typeof v==='object'){ el.textContent=v.t||''; el.className=base+(v.c?' '+v.c:''); }
    else { el.textContent=v==null?'':v; el.className=base; }
  });
}
function autosize(t){ t.style.height='auto'; t.style.height=t.scrollHeight+'px'; }
function autosizeAll(){ document.querySelectorAll('#sheet textarea.in').forEach(autosize); }
function markEmpty(){ document.querySelectorAll('#sheet input[type=date],#sheet input[type=time]').forEach(i=>i.classList.toggle('empty',!i.value)); }

/* ---------- 저장 ---------- */
function touch(){ cur.s._touched=1; clearTimeout(saveT); saveT=setTimeout(saveNow,400); }
function saveNow(){
  clearTimeout(saveT); saveT=null; if(!cur) return;
  if(LS.set('draft.'+cur.def.id,cur.s)){ const d=new Date(), el=$('#saved'); if(el) el.textContent='자동 저장됨 '+pad2(d.getHours())+':'+pad2(d.getMinutes()); }
  else toast('저장 공간이 부족해 저장하지 못했어요. [지난 문서]에서 오래된 문서를 지워 주세요.');
}
function archList(){ return LS.get('arch.'+cur.def.id,[]); }
function updateArchCount(){ const el=$('#archn'); if(el){ const n=archList().length; el.textContent=n||''; el.hidden=!n; } }
function summary(s){ const t=(cur.def.sum||[]).map(k=>k==='date'?fmtDate(s[k]):s[k]).filter(Boolean).join('  '); return t||'제목 없음'; }
function pushArchive(){
  const a=archList(); a.unshift({t:Date.now(), sum:summary(cur.s), s:cur.s});
  while(a.length>30) a.pop();
  if(!LS.set('arch.'+cur.def.id,a)){ toast('저장 공간이 부족해 보관하지 못했어요. [지난 문서]에서 오래된 문서를 지워 주세요.'); return false; }
  return true;
}
function clearSigs(o){ if(Array.isArray(o)) o.forEach(clearSigs); else if(o&&typeof o==='object') Object.keys(o).forEach(k=>{ if(k==='sig') o[k]=''; else clearSigs(o[k]); }); }

/* ---------- 입력 ---------- */
function onInput(e){
  const t=e.target;
  if(t.id==='q'){ filterHome(t.value); return; }
  if(t.type==='file'){ if(e.type==='change') addPhotos(t.files); return; }
  if(t.dataset.photo!=null){ const x=PHOTOS[cur.def.id][+t.dataset.photo]; if(x) x.cap=t.value; return; }
  const p=t.dataset.p; if(!p||!cur||!t.isConnected||!app.contains(t)) return;
  const parent=p.split('.').slice(0,-1).join('.');
  if(parent&&getP(cur.s,parent)==null) return;
  if(getP(cur.s,p)===t.value) return;
  setP(cur.s,p,t.value);
  if(cur.shared[p]){ const sh=LS.get('shared',{}); sh[cur.shared[p]]=t.value; LS.set('shared',sh); }
  touch();
  if(t.tagName==='TEXTAREA') autosize(t);
  if(t.type==='date'||t.type==='time') t.classList.toggle('empty',!t.value);
  if(cur.def.onChange&&cur.def.onChange(cur.s,p)){ drawSheet(); return; }
  updateCalcs();
}
app.addEventListener('input',onInput);
app.addEventListener('change',onInput);

app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(!b||!app.contains(b)||b.dataset.act==='addphoto') return;
  const k=b.dataset.k, i=+b.dataset.i;
  switch(b.dataset.act){
    case 'print': saveNow(); autosizeAll(); window.print(); break;
    case 'addrow': { const bl=blockByK(k), n=+b.dataset.n||1; for(let j=0;j<n;j++) cur.s[k].push(emptyRow(bl.cols)); touch(); drawSheet(); break; }
    case 'delrow': {
      const rows=cur.s[k], bl=blockByK(k);
      if(bl.t==='table'&&rows.length<=1){ rows[0]=emptyRow(bl.cols); }
      else rows.splice(i,1);
      touch(); drawSheet(); break; }
    case 'addchk': cur.s[k].push({name:'',res:'',note:'',src:'self'}); touch(); drawSheet();
      { const ta=document.querySelectorAll('#sheet textarea[data-p="'+k+'.'+(cur.s[k].length-1)+'.name"]')[0]; ta&&ta.focus(); } break;
    case 'mark': {
      const p=b.dataset.p, v=b.dataset.v; setP(cur.s,p,getP(cur.s,p)===v?'':v); touch();
      b.closest('tr').querySelectorAll('[data-act=mark]').forEach(x=>{ const on=getP(cur.s,x.dataset.p)===x.dataset.v; x.textContent=on?'○':''; x.setAttribute('aria-pressed',on); });
      break; }
    case 'sign': openSign(b.dataset.p); break;
    case 'paste': openPaste(k); break;
    case 'example': {
      const bl=blockByK(k), txt=bl.example(cur.s);
      if(!txt){ toast('이 교육 과정·대상에 맞는 예시는 아직 없어요. 직접 적어 주세요.'); break; }
      if(cur.s[k]&&!confirm('지금 적은 교육 내용을 예시 문구로 바꿀까요?')) break;
      cur.s[k]=txt; touch(); drawSheet(); break; }
    case 'delphoto': PHOTOS[cur.def.id].splice(i,1); drawSheet(); break;
    case 'arch': openArchive(); break;
    case 'newdoc': {
      const was=!!cur.s._touched;
      if(was&&!pushArchive()) break;
      cur.s=newState(cur.def); PHOTOS[cur.def.id]=[]; saveNow(); drawSheet(); window.scrollTo(0,0);
      toast(was?'지금 문서를 지난 문서에 보관하고 새 서식을 열었어요.':'새 서식을 열었어요.'); break; }
    case 'reset':
      if(!confirm('입력한 내용을 모두 지우고 처음 서식으로 되돌릴까요? 지난 문서는 그대로 남아요.')) break;
      cur.s=newState(cur.def); PHOTOS[cur.def.id]=[]; saveNow(); drawSheet(); toast('처음 서식으로 되돌렸어요.'); break;
  }
});

/* ---------- 사진 ---------- */
async function addPhotos(files){
  for(const f of files){ if(!f.type.startsWith('image/')) continue; PHOTOS[cur.def.id].push({url:await shrink(f,1600),cap:''}); }
  drawSheet();
}
function shrink(file,max){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const img=new Image();
      img.onload=()=>{ const sc=Math.min(1,max/Math.max(img.width,img.height)), c=document.createElement('canvas');
        c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); c.getContext('2d').drawImage(img,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.85)); };
      img.onerror=()=>res(fr.result); img.src=fr.result; };
    fr.readAsDataURL(file);
  });
}

/* ---------- 창 ---------- */
let modalFn=null, lastFocus=null;
function openModal(html,fn){
  lastFocus=document.activeElement;
  modal.innerHTML='<div class="mbox" role="dialog" aria-modal="true">'+html+'</div>';
  modal.hidden=false; modalFn=fn;
  const f=modal.querySelector('textarea,.btn.pri,.btn'); f&&f.focus();
}
function closeModal(){ modal.hidden=true; modal.innerHTML=''; modalFn=null; if(lastFocus&&document.body.contains(lastFocus)) lastFocus.focus(); }
modal.addEventListener('click',e=>{
  if(e.target===modal){ closeModal(); return; }
  const b=e.target.closest('[data-m]'); if(!b) return;
  if(b.dataset.m==='close'){ closeModal(); return; }
  modalFn&&modalFn(b.dataset.m,b);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!modal.hidden) closeModal(); });

function openSign(p){
  const had=!!getP(cur.s,p);
  openModal('<h2 class="mt">서명</h2><p class="ms">아래 칸에 마우스로 서명하세요.</p><canvas class="pad" width="1000" height="360" aria-label="서명 칸"></canvas>'
    +'<div class="mb"><button class="btn" data-m="clear">다시 쓰기</button>'+(had?'<button class="btn" data-m="remove">서명 지우기</button>':'')+'<span class="sp"></span><button class="btn" data-m="close">취소</button><button class="btn pri" data-m="ok">서명 넣기</button></div>',
    m=>{
      if(m==='clear'){ ctx.clearRect(0,0,cv.width,cv.height); inked=false; return; }
      if(m==='remove'){ setP(cur.s,p,''); touch(); closeModal(); drawSheet(); return; }
      if(m==='ok'){ if(!inked){ toast('서명을 먼저 써 주세요.'); return; } setP(cur.s,p,trimSig(cv)); touch(); closeModal(); drawSheet(); }
    });
  const cv=$('.pad',modal), ctx=cv.getContext('2d'); let drawing=false, inked=false;
  ctx.lineWidth=8; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111';
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]; };
  cv.addEventListener('pointerdown',e=>{ drawing=true; inked=true; cv.setPointerCapture(e.pointerId); const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+.1,y+.1); ctx.stroke(); });
  cv.addEventListener('pointermove',e=>{ if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ drawing=false; }));
}
function trimSig(cv){
  const w=cv.width, h=cv.height, d=cv.getContext('2d').getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=0,y1=0;
  for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2) if(d[(y*w+x)*4+3]>0){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  const m=14; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w,x1+m); y1=Math.min(h,y1+m);
  const sw=Math.max(1,x1-x0), sh=Math.max(1,y1-y0), sc=Math.min(1,120/sh,360/sw);
  const o=document.createElement('canvas'); o.width=Math.max(1,Math.round(sw*sc)); o.height=Math.max(1,Math.round(sh*sc));
  o.getContext('2d').drawImage(cv,x0,y0,sw,sh,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

function openPaste(k){
  openModal('<h2 class="mt">명단 붙여넣기</h2><p class="ms">엑셀에서 소속·직위·성명 칸을 복사해 붙여 넣으세요. 한 줄에 한 사람씩이에요. 성명만 있어도 돼요. 빈 줄부터 차례로 채워요.</p>'
    +'<textarea class="pastebox" rows="10" placeholder="안전시설팀&#9;주임&#9;홍길동"></textarea>'
    +'<div class="mb"><span class="sp"></span><button class="btn" data-m="close">취소</button><button class="btn pri" data-m="ok">명단 넣기</button></div>',
    m=>{
      if(m!=='ok') return;
      const bl=blockByK(k), rows=cur.s[k];
      const tf=bl.cols.filter(c=>c.t==='text1').map(c=>c.k);
      const lines=$('.pastebox',modal).value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if(!lines.length){ toast('붙여 넣은 명단이 없어요.'); return; }
      let idx=rows.findIndex(r=>!tf.some(f=>r[f]));
      if(idx<0) idx=rows.length;
      lines.forEach(l=>{
        const parts=l.split(/\t|,|\s{2,}/).map(x=>x.trim()).filter(Boolean);
        const row=rows[idx]||emptyRow(bl.cols);
        row.name=parts[parts.length-1];
        if(parts.length>=2&&tf.includes('dept')) row.dept=parts[0];
        if(parts.length>=3&&tf.includes('pos')) row.pos=parts[1];
        rows[idx]=row; idx++;
        while(idx<rows.length&&tf.some(f=>rows[idx][f])) idx++;
      });
      touch(); closeModal(); drawSheet(); toast(lines.length+'명을 넣었어요.');
    });
}

function openArchive(){
  const a=archList();
  openModal('<h2 class="mt">지난 문서</h2>'
    +(a.length?'<p class="ms">[보관하고 새로 작성]을 누를 때마다 여기에 쌓여요. 최근 30개까지 보관해요.</p><ul class="alist">'+a.map((x,i)=>'<li><div><b>'+esc(x.sum)+'</b><span>'+fmtStamp(x.t)+' 보관</span></div><div class="ab"><button class="btn" data-m="open" data-i="'+i+'">불러오기</button><button class="btn" data-m="copy" data-i="'+i+'">복사해서 새로 작성</button><button class="btn" data-m="del" data-i="'+i+'">지우기</button></div></li>').join('')+'</ul>'
      :'<p class="ms">아직 보관한 문서가 없어요. [보관하고 새로 작성]을 누르면 지금 문서가 여기에 쌓여요.</p>')
    +'<div class="mb"><span class="sp"></span><button class="btn" data-m="close">닫기</button></div>',
    (m,b)=>{
      const i=+b.dataset.i, list=archList(), x=list[i]; if(!x) return;
      if(m==='del'){ if(!confirm('이 문서를 지울까요? 되돌릴 수 없어요.')) return; list.splice(i,1); LS.set('arch.'+cur.def.id,list); updateArchCount(); openArchive(); return; }
      if(cur.s._touched){ if(!pushArchive()) return; }
      const fresh=archList(); const at=fresh.findIndex(y=>y.t===x.t);
      if(m==='open'){
        if(at>-1){ fresh.splice(at,1); LS.set('arch.'+cur.def.id,fresh); }
        cur.s=JSON.parse(JSON.stringify(x.s)); toast('지난 문서를 불러왔어요.');
      } else {
        const s=JSON.parse(JSON.stringify(x.s)); clearSigs(s);
        Object.keys(s).forEach(k=>{ if(k==='date') s[k]=todayStr(); });
        s._touched=1; cur.s=s; toast('복사했어요. 날짜는 오늘로 바꾸고 서명은 비웠어요.');
      }
      PHOTOS[cur.def.id]=[]; saveNow(); closeModal(); drawSheet(); window.scrollTo(0,0);
    });
}

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2800); }

/* ---------- 이동 ---------- */
function route(){
  const ae=document.activeElement;
  if(ae&&ae!==document.body&&app.contains(ae)) ae.blur();
  if(cur&&saveT) saveNow();
  if(!modal.hidden) closeModal();
  const m=location.hash.replace(/^#\/?/,'').match(/^f\/([\w-]+)/);
  if(m) renderForm(m[1]); else { cur=null; renderHome(); }
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
window.addEventListener('pagehide',()=>{ if(cur&&saveT) saveNow(); });
route();
</script>
